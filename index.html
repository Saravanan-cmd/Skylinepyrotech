  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 24px;
      background: linear-gradient(135deg, #120b2e, #24104f 55%, #0b1738);
      color: #172033;
      min-height: 100vh;
    }

    .app {
      max-width: 1250px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 18px 55px rgba(0,0,0,.30);
    }

    .company-header {
      text-align: center;
      padding: 24px 20px 18px;
      background: linear-gradient(135deg, #24104f, #4b1d7a, #b8860b);
      color: #fff;
    }

    .company-header h1 {
      margin: 0;
      font-size: 30px;
      letter-spacing: 2px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .company-header .tagline {
      margin-top: 7px;
      font-size: 13px;
      letter-spacing: 1.5px;
      opacity: .9;
    }

    .content { padding: 24px; }

    label {
      display: block;
      font-weight: 700;
      color: #30204f;
      margin-bottom: 6px;
    }

    input, textarea, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d5cbe6;
      border-radius: 8px;
      background: #fbfaff;
      font: inherit;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #7b3fb6;
      box-shadow: 0 0 0 3px rgba(123,63,182,.12);
    }

    .customer-grid {
      display: grid;
      grid-template-columns: 1fr 1.5fr;
      gap: 18px;
      margin-bottom: 20px;
    }

    .table-wrap {
      overflow-x: auto;
      border-radius: 10px;
      border: 1px solid #ded7ea;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
      margin: 0;
    }

    th {
      background: #3b1768;
      color: white;
      padding: 10px 8px;
      text-align: center;
      font-size: 13px;
    }

    td {
      border: 1px solid #e5dfef;
      padding: 7px;
      text-align: center;
      background: #fff;
    }

    tbody tr:nth-child(even) td { background: #faf8fd; }

    .btn {
      margin-top: 15px;
      padding: 10px 16px;
      cursor: pointer;
      border: 0;
      border-radius: 8px;
      background: #4b1d7a;
      color: white;
      font-weight: 700;
      transition: .2s;
    }

    .btn:hover { background: #321052; transform: translateY(-1px); }

    .btn.secondary { background: #b8860b; }
    .btn.danger { background: #a52a2a; margin-top: 0; padding: 7px 11px; }

    .total-card {
      margin-top: 20px;
      padding: 15px 18px;
      border-radius: 10px;
      background: #f5effc;
      border-left: 5px solid #b8860b;
      text-align: right;
    }

    .total-card h3 { margin: 0; color: #3b1768; }

    .saved-section {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid #e2dced;
    }

    @media (max-width: 700px) {
      body { padding: 10px; }
      .content { padding: 14px; }
      .customer-grid { grid-template-columns: 1fr; }
      .company-header h1 { font-size: 23px; }
    }
  </style>
</head>

        <td><input type="number" value="1" oninput="updateTotal(this)"></td>
        <td class="rate">0</td>
        <td class="discount">0</td>
        <td class="finalRate">0</td>
        <td class="rowTotal">0</td>
        <td><button onclick="removeRow(this)">X</button></td>
      `;

      if (data) {
        let sel = row.cells[0].children[0];
        sel.value = data.name;
        updateRow(sel);
        row.cells[1].children[0].value = data.qty;
        updateTotal(row.cells[1].children[0]);
      }
    }

    function updateRow(sel) {
      let row = sel.parentElement.parentElement;
      let product = products.find(p => p.name === sel.value);
      if (product) {
        row.querySelector(".rate").innerText = product.rate;
        row.querySelector(".discount").innerText = product.discount;
        row.querySelector(".finalRate").innerText = product.finalRate;
        updateTotal(row.cells[1].children[0]);
      }
    }

    function updateTotal(el) {
      let row = el.parentElement.parentElement;
      let qty = row.cells[1].children[0].value;
      let finalRate = Number(row.querySelector(".finalRate").innerText);
      let total = qty * finalRate;
      row.querySelector(".rowTotal").innerText = total;
      updateGrandTotal();
    }

    function updateGrandTotal() {
      let totals = document.querySelectorAll(".rowTotal");
      let sum = 0;
      totals.forEach(t => sum += Number(t.innerText));
      document.getElementById("grandTotal").innerText = sum;
    }

    function removeRow(btn) {
      btn.parentElement.parentElement.remove();
      updateGrandTotal();
    }

    function generateInvoiceNumber() {
      let now = new Date();
      return "INV-" + now.getFullYear().toString() +
             (now.getMonth()+1).toString().padStart(2,'0') +
             now.getDate().toString().padStart(2,'0') + "-" +
             now.getHours().toString().padStart(2,'0') +
             now.getMinutes().toString().padStart(2,'0') +
             now.getSeconds().toString().padStart(2,'0');
    }

    function generatePDF() {
      const { jsPDF } = window.jspdf;
      let doc = new jsPDF();

      let customer = document.getElementById("customer").value || "Unknown";
      let address = document.getElementById("address").value || "N/A";
      let grandTotal = document.getElementById("grandTotal").innerText;
      let invoiceNo = generateInvoiceNumber();
      let today = new Date().toLocaleDateString();

      // Header - SKYLINE PYROTECH branded PDF
      // Dark navy header with gold accent
      doc.setFillColor(23, 37, 84);
      doc.rect(0, 0, 210, 28, "F");

      doc.setTextColor(245, 158, 11);
      doc.setFontSize(18);
      doc.setFont(undefined, "bold");
      doc.text("SKYLINE PYROTECH", 105, 10, { align: "center" });

      doc.setTextColor(255, 255, 255);
      doc.setFontSize(10);
      doc.setFont(undefined, "normal");
      doc.text("CRACKERS • FIREWORKS", 105, 17, { align: "center" });

      doc.setTextColor(23, 37, 84);
      doc.setFontSize(15);
      doc.setFont(undefined, "bold");
      doc.text("ESTIMATE", 105, 36, { align: "center" });

      doc.setFontSize(11);
      doc.setFont(undefined, "normal");
      doc.setTextColor(0, 0, 0);
      doc.text("To: " + customer, 14, 47);
      doc.text("Address: " + address, 14, 54);
      doc.text("Estimate No: " + invoiceNo, 150, 47);
      doc.text("Date: " + today, 150, 55);

      // Build table data
      let rows = [];
      let table = document.getElementById("invoiceTable");
      for (let i = 1; i < table.rows.length; i++) {
        let cells = table.rows[i].cells;
        let productName = cells[0].children[0].value;

        rows.push([
          i,
          productName,
          cells[1].children[0].value,
          cells[2].innerText,
          cells[3].innerText,
          cells[4].innerText,
          cells[5].innerText
        ]);
      }

      // Table
      doc.autoTable({
        head: [["S.No", "Product", "Qty", "Rate", "Discount", "Final Rate", "Total"]],
        body: rows,
        startY: 64,
        theme: "grid",
        headStyles: {
          fillColor: [23, 37, 84],
          textColor: [255, 255, 255],
          fontStyle: "bold",
          halign: "center"
        },
        bodyStyles: {
          textColor: [23, 32, 51]
        },
        alternateRowStyles: {
          fillColor: [248, 250, 252]
        },
        styles: {
          lineColor: [203, 213, 225],
          lineWidth: 0.2,
          fontSize: 8
        }
      });

      let finalY = doc.lastAutoTable.finalY + 10;
      doc.setFontSize(12);
      doc.setTextColor(23, 37, 84);
      doc.setFont(undefined, "bold");
      doc.text("Sub Total: " + grandTotal, 140, finalY);
      doc.setFont(undefined, "normal");
      doc.text("Discount: 90%", 140, finalY + 8);
      doc.text("Packing: 0", 140, finalY + 16);

      // Highlight Net Amount
      doc.setFillColor(239, 246, 255);
      doc.roundedRect(136, finalY + 19, 60, 10, 2, 2, "F");
      doc.setTextColor(23, 37, 84);
      doc.setFont(undefined, "bold");
      doc.text("Net Amount: " + grandTotal, 140, finalY + 26);

      doc.save(invoiceNo + ".pdf");
    }

    // -------- SAVE BILL TO LOCALSTORAGE ----------
    function saveBill() {
      let invoiceNo = generateInvoiceNumber();
      let customer = document.getElementById("customer").value;
      let address = document.getElementById("address").value;
      let grandTotal = document.getElementById("grandTotal").innerText;

      let items = [];
      let table = document.getElementById("invoiceTable");
      for (let i = 1; i < table.rows.length; i++) {
        let cells = table.rows[i].cells;
        let sel = cells[0].children[0];
        items.push({
          name: sel.value,
          qty: cells[1].children[0].value
        });
      }

      let bill = { invoiceNo, customer, address, grandTotal, items };

      let saved = JSON.parse(localStorage.getItem("bills") || "[]");
      saved.push(bill);
      localStorage.setItem("bills", JSON.stringify(saved));

      alert("Bill saved!");
      loadSavedBills();
    }

    function loadSavedBills() {
      let saved = JSON.parse(localStorage.getItem("bills") || "[]");
      let select = document.getElementById("savedBills");
      select.innerHTML = `<option value="">-- Select a saved bill --</option>`;
      saved.forEach(b => {
        select.innerHTML += `<option value="${b.invoiceNo}">${b.invoiceNo} - ${b.customer}</option>`;
      });
    }

    function loadBill(invoiceNo) {
      if (!invoiceNo) return;
      let saved = JSON.parse(localStorage.getItem("bills") || "[]");
      let bill = saved.find(b => b.invoiceNo == invoiceNo);
      if (!bill) return;

      document.getElementById("customer").value = bill.customer;
      document.getElementById("address").value = bill.address;

      // Clear table
      let table = document.getElementById("invoiceTable");
      while (table.rows.length > 1) {
        table.deleteRow(1);
      }

      bill.items.forEach(it => addRow(it));
      updateGrandTotal();
    }

    // Load bills on page start
    window.onload = loadSavedBills;
  </script>
</div></div>
</body>
