* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #120b2e, #24104f 55%, #0b1738);
    color: #fff;
    padding: 20px;
}

.container {
    max-width: 1200px;
    margin: auto;
}

.company-header {
    background: linear-gradient(135deg, #24104f, #4b1d7a, #b8860b);
    padding: 25px;
    border-radius: 15px;
    text-align: center;
    margin-bottom: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.3);
}

.company-header h1 {
    margin: 0;
    font-size: 32px;
    letter-spacing: 2px;
}

.company-header p {
    margin: 8px 0 0;
    font-size: 14px;
    letter-spacing: 1px;
}

.form-section {
    background: rgba(255,255,255,0.08);
    padding: 20px;
    border-radius: 15px;
    margin-bottom: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.2);
}

.form-row {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
}

.form-group {
    flex: 1;
    min-width: 200px;
}

label {
    display: block;
    margin-bottom: 6px;
    font-weight: bold;
}

input,
select {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: none;
    outline: none;
    font-size: 14px;
}

button {
    border: none;
    padding: 11px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    margin: 5px;
}

.btn-add {
    background: #22c55e;
    color: #fff;
}

.btn-pdf {
    background: #f59e0b;
    color: #fff;
}

.btn-save {
    background: #3b82f6;
    color: #fff;
}

.btn-load {
    background: #8b5cf6;
    color: #fff;
}

.btn-remove {
    background: #ef4444;
    color: #fff;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
    background: #fff;
    color: #111;
    border-radius: 10px;
    overflow: hidden;
}

th {
    background: #24104f;
    color: #fff;
    padding: 10px;
}

td {
    padding: 8px;
    border-bottom: 1px solid #ddd;
    text-align: center;
}

td input,
td select {
    border: 1px solid #ccc;
    color: #111;
}

.total-section {
    text-align: right;
    margin-top: 20px;
    background: rgba(255,255,255,0.08);
    padding: 15px;
    border-radius: 10px;
}

.total-section h2 {

}

.actions {
    text-align: center;
    margin-top: 20px;
}

@media(max-width: 768px) {
    body {
        padding: 10px;
    }

    .company-header h1 {

    }

    table {
        font-size: 12px;
    }

    th,
    td {
        padding: 5px;
    }
}
</style>
</head>

            </div>

            <div class="form-group">

                    <th>Qty</th>

                    <th>Discount</th>
                    <th>Final Rate</th>

                    <th>Action</th>

            </thead>

            <tbody>
            </tbody>

        </table>

        <div style="text-align:center; margin-top:15px;">
            <button class="btn-add" onclick="addRow()">+ Add Product</button>
        </div>

    </div>

    <div class="total-section">

        <h2>Grand Total: ₹ <span id="grandTotal">0.00</span></h2>

    </div>

    <div class="actions">

        <button class="btn-pdf" onclick="generatePDF()">Generate PDF</button>

        <button class="btn-save" onclick="saveBill()">Save Bill</button>

        <button class="btn-load" onclick="loadBill()">Load Bill</button>

    </div>

</div>

function addRow() {

    let table = document.getElementById("invoiceTable").getElementsByTagName("tbody")[0];

    let row = table.insertRow();

    let index = table.rows.length;

    let productOptions = "";

    products.forEach((p, i) => {
        productOptions += `<option value="${i}">${p.name}</option>`;
    });

    row.innerHTML = `
        <td>${index}</td>

        <td>
            <select onchange="updateRow(this)">
                ${productOptions}
            </select>
        </td>

        <td>
            <input type="number" value="1" min="1" onchange="updateRow(this)">
        </td>

        <td class="rate">0.00</td>

        <td class="discount">90%</td>

        <td class="finalRate">0.00</td>

        <td class="rowTotal">0.00</td>

        <td>
            <button class="btn-remove" onclick="removeRow(this)">
                Remove
            </button>
        </td>
    `;

    updateRow(row.querySelector("select"));

}

function updateRow(element) {

    let row = element.closest("tr");

    let select = row.querySelector("select");

    let qtyInput = row.querySelector("input");

    let product = products[select.value];

    let qty = parseFloat(qtyInput.value) || 0;

    let rate = product.rate;

    let discountPercent = 90;

    let finalRate = rate * (100 - discountPercent) / 100;

    let total = finalRate * qty;

    row.querySelector(".rate").innerText = rate.toFixed(2);

    row.querySelector(".discount").innerText = discountPercent + "%";

    row.querySelector(".finalRate").innerText = finalRate.toFixed(2);

    row.querySelector(".rowTotal").innerText = total.toFixed(2);

    updateTotal();
}

function updateTotal() {

    let total = 0;

    let rows = document.querySelectorAll("#invoiceTable tbody tr");

    rows.forEach(row => {

        total += parseFloat(row.querySelector(".rowTotal").innerText) || 0;

    });

    document.getElementById("grandTotal").innerText = total.toFixed(2);

}

function updateGrandTotal() {
    updateTotal();
}

function removeRow(button) {

    button.closest("tr").remove();

    let rows = document.querySelectorAll("#invoiceTable tbody tr");

    rows.forEach((row, index) => {

        row.cells[0].innerText = index + 1;

    });

    updateTotal();

}

function generateInvoiceNumber() {

    let now = new Date();

    let year = now.getFullYear();

    let month = String(now.getMonth() + 1).padStart(2, "0");

    let day = String(now.getDate()).padStart(2, "0");

    let time = String(now.getHours()).padStart(2, "0") +
               String(now.getMinutes()).padStart(2, "0") +
               String(now.getSeconds()).padStart(2, "0");

    return "SP-" + year + month + day + "-" + time;

}

function generatePDF() {

    const { jsPDF } = window.jspdf;

    let doc = new jsPDF();

    let customer =
        document.getElementById("customer").value || "Unknown";

    let address =
        document.getElementById("address").value || "N/A";

    let grandTotal =
        document.getElementById("grandTotal").innerText;

    let invoiceNo =
        generateInvoiceNumber();

    let today =
        new Date().toLocaleDateString();

    /*
    ============================================================
       PDF OUTPUT DESIGN ONLY
       SKYLINE PYROTECH
    ============================================================
    */

    // ----------------------------------------------------------
    // TOP BRAND HEADER
    // ----------------------------------------------------------

    doc.setFillColor(23, 37, 84);

    doc.rect(
        0,
        0,
        210,
        28,
        "F"
    );

    // Gold company name

    doc.setTextColor(
        245,
        158,
        11
    );

    doc.setFontSize(18);

    doc.setFont(
        undefined,
        "bold"
    );

    doc.text(
        "SKYLINE PYROTECH",
        105,
        10,
        {
            align: "center"
        }
    );

    // Subtitle

    doc.setTextColor(
        255,
        255,
        255
    );

    doc.setFontSize(10);

    doc.setFont(
        undefined,
        "normal"
    );

    doc.text(
        "CRACKERS • FIREWORKS",
        105,
        17,
        {
            align: "center"
        }
    );

    // ----------------------------------------------------------
    // ESTIMATE TITLE
    // ----------------------------------------------------------

    doc.setTextColor(
        23,
        37,
        84
    );

    doc.setFontSize(15);

    doc.setFont(
        undefined,
        "bold"
    );

    doc.text(
        "ESTIMATE",
        105,
        36,
        {
            align: "center"
        }
    );

    // ----------------------------------------------------------
    // CUSTOMER DETAILS
    // ----------------------------------------------------------

    doc.setFontSize(11);

    doc.setFont(
        undefined,
        "normal"
    );

    doc.setTextColor(
        0,
        0,
        0
    );

    doc.text(
        "To: " + customer,
        14,
        47
    );

    doc.text(
        "Address: " + address,
        14,
        54
    );

    doc.text(
        "Estimate No: " + invoiceNo,
        150,
        47
    );

    doc.text(
        "Date: " + today,
        150,
        55
    );

    // ----------------------------------------------------------
    // BUILD TABLE DATA
    // ----------------------------------------------------------

    let rows = [];

    let table =
        document.getElementById("invoiceTable");

    for (
        let i = 1;
        i < table.rows.length;
        i++
    ) {

        let cells =
            table.rows[i].cells;

        let productName =
            cells[1]
            .children[0]
            .value;

        rows.push([

            i,

            products[
                productName
            ]?.name ||
            cells[1]
            .children[0]
            .options[
                cells[1]
                .children[0]
                .selectedIndex
            ].text,

            cells[2]
            .children[0]
            .value,

            cells[3].innerText,

            cells[4].innerText,

            cells[5].innerText,

            cells[6].innerText

        ]);

    }

    // ----------------------------------------------------------
    // PDF TABLE
    // ----------------------------------------------------------

    doc.autoTable({

        head: [[
            "S.No",
            "Product",
            "Qty",
            "Rate",
            "Discount",
            "Final Rate",
            "Total"
        ]],

        body: rows,

        startY: 64,

        theme: "grid",

        headStyles: {

            fillColor: [
                23,
                37,
                84
            ],

            textColor: [
                255,
                255,
                255
            ],

            fontStyle: "bold",

            halign: "center"

        },

        bodyStyles: {

            textColor: [
                23,
                32,
                51
            ]

        },

        alternateRowStyles: {

            fillColor: [
                248,
                250,
                252
            ]

        },

        styles: {

            lineColor: [
                203,
                213,
                225
            ],

            lineWidth: 0.2,

            fontSize: 8

        }

    });

    // ----------------------------------------------------------
    // TOTALS
    // ----------------------------------------------------------

    let finalY =
        doc.lastAutoTable.finalY + 10;

    doc.setFontSize(12);

    doc.setTextColor(
        23,
        37,
        84
    );

    doc.setFont(
        undefined,
        "bold"
    );

    doc.text(
        "Sub Total: " + grandTotal,
        140,
        finalY
    );

    doc.setFont(
        undefined,
        "normal"
    );

    doc.text(
        "Discount: 90%",
        140,
        finalY + 8
    );

    doc.text(
        "Packing: 0",
        140,
        finalY + 16
    );

    // ----------------------------------------------------------
    // NET AMOUNT HIGHLIGHT
    // ----------------------------------------------------------

    doc.setFillColor(
        239,
        246,
        255
    );

    doc.roundedRect(
        136,
        finalY + 19,
        60,
        10,
        2,
        2,
        "F"
    );

    doc.setTextColor(
        23,
        37,
        84
    );

    doc.setFont(
        undefined,
        "bold"
    );

    doc.text(
        "Net Amount: " + grandTotal,
        140,
        finalY + 26
    );

    // ----------------------------------------------------------
    // SAVE PDF
    // ----------------------------------------------------------

    doc.save(
        invoiceNo + ".pdf"
    );

}

function saveBill() {

    let bill = {

            document.getElementById(
                "customer"
            ).value,

        address:

                "address"
            ).value,

        rows: []

    };

    let rows =
        document.querySelectorAll(
            "#invoiceTable tbody tr"
        );

    rows.forEach(row => {

        bill.rows.push({

            product:
                row.querySelector(
                    "select"
                ).value,

            qty:
                row.querySelector(
                    "input"
                ).value

        });

    });

    localStorage.setItem(
        "skylinePyrotechBill",
        JSON.stringify(bill)
    );

    alert(
        "Bill saved successfully!"
    );

}

// --------------------------------------------------------------
// LOAD BILL
// --------------------------------------------------------------

function loadBill() {

    let saved =
        localStorage.getItem(
            "skylinePyrotechBill"
        );

    if (!saved) {

        alert(
            "No saved bill found!"
        );

        return;

    }

    let bill =
        JSON.parse(saved);

    document.getElementById(
        "customer"
    ).value =
        bill.customer || "";

    document.getElementById(
        "address"
    ).value =
        bill.address || "";

    let tbody =
        document.querySelector(
            "#invoiceTable tbody"
        );

    tbody.innerHTML = "";

    bill.rows.forEach(item => {

        let table =
            document.getElementById(
                "invoiceTable"
            );

        let row =
            table
            .getElementsByTagName(
                "tbody"
            )[0]
            .insertRow();

        let index =
            table
            .getElementsByTagName(
                "tbody"
            )[0]
            .rows.length;

        let productOptions = "";

        products.forEach(
            (p, i) => {

                productOptions +=
                    `<option value="${i}">
                        ${p.name}
                    </option>`;

            }
        );

        row.innerHTML = `

            <td>${index}</td>

            <td>

                <select onchange="updateRow(this)">

                    ${productOptions}

                </select>

            </td>

            <td>

                <input
                    type="number"
                    value="${item.qty}"
                    min="1"
                    onchange="updateRow(this)"
                >

            </td>

            <td class="rate">
                0.00
            </td>

            <td class="discount">
                90%
            </td>

            <td class="finalRate">
                0.00
            </td>

            <td class="rowTotal">
                0.00
            </td>

            <td>

                <button
                    class="btn-remove"
                    onclick="removeRow(this)"
                >
                    Remove
                </button>

            </td>

        `;

        row.querySelector(
            "select"
        ).value =
            item.product;

        updateRow(
            row.querySelector(
                "select"
            )
        );

    });

    updateTotal();

}

</script>
